[package]
name = "aspect-zeroclaw-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Working examples of aspect-rs patterns applied to ZeroClaw agent framework tools"

[dependencies]
aspect-core = { workspace = true }
aspect-macros = { workspace = true }
aspect-std = { workspace = true }
aspect-agent = { path = "../aspect-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []

[[bin]]
name = "file_tool_logging"
path = "src/bin/file_tool_logging.rs"

[[bin]]
name = "tool_scope_demo"
path = "src/bin/tool_scope_demo.rs"

[[bin]]
name = "human_approval_demo"
path = "src/bin/human_approval_demo.rs"

[[bin]]
name = "full_stack_demo"
path = "src/bin/full_stack_demo.rs"
